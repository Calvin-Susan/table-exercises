<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>Two Futures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<!-- Passcode screen shown before an exercise is unlocked. Used by build.sh; matches the hub's look. -->
<style>
  :root{
    --bg:#1A1A18; --ink:#ffffff; --muted:#a8a69f; --line:#3a3935;
    --field:#232320; --accent:#fec200; --accent-ink:#1A1A18; --soft:#26261f; --error:#ff8f8f;
    box-sizing:border-box; color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{background:var(--bg)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:18px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important}
  .wrap{max-width:480px; margin:0 auto; padding:72px 22px 80px}
  .home{display:inline-block; margin:0 0 28px; color:var(--muted); font-size:.9rem; text-decoration:none}
  .home:hover{color:var(--accent)}
  .kicker{font-family:"Outfit",sans-serif; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:.85rem; margin:0 0 8px}
  h1{font-family:"Outfit","Inter",sans-serif; font-size:2.4rem; line-height:1.1; font-weight:700; letter-spacing:-0.01em; margin:0 0 14px}
  p{margin:0 0 24px; color:var(--muted)}
  label{display:block; font-weight:600; font-size:.95rem; margin:0 0 8px}
  .field{position:relative}
  input[type="password"],input[type="text"]{
    width:100%; font:inherit; color:var(--ink); background:var(--field);
    border:1.5px solid var(--line); border-radius:4px; padding:12px 52px 12px 14px;
  }
  input:focus{outline:none; border-color:var(--accent)}
  .toggle{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); font:inherit; font-size:.85rem; padding:6px 8px; cursor:pointer}
  .toggle:hover{color:var(--ink)}
  .error{color:var(--error); font-size:.92rem; margin:10px 0 0; min-height:1.4em}
  .remember{display:flex; align-items:center; gap:10px; margin:14px 0 22px; font-weight:400; color:var(--muted); font-size:.95rem; cursor:pointer}
  .remember input{width:18px; height:18px; accent-color:var(--accent)}
  button[type="submit"]{
    width:100%; font:inherit; font-weight:600; border:0; border-radius:4px; padding:13px 18px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  button[type="submit"]:hover{filter:brightness(1.06)}
  .spinner-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center}
  .spinner{width:2rem; height:2rem; border:.25em solid var(--line); border-right-color:transparent; border-radius:50%; animation:spin .75s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){ .wrap{padding-top:40px} h1{font-size:2rem} }
</style>
</head>
<body class="staticrypt-body">
<div id="staticrypt_loading" class="spinner-wrap"><div class="spinner"></div></div>

<div id="staticrypt_content" class="hidden">
  <div class="wrap">
    <a class="home" href="../">← All exercises</a>
    <p class="kicker">TABLE</p>
    <h1>Two Futures</h1>
    <p>Your host will share the passcode when your group starts this exercise.</p>

    <form id="staticrypt-form" action="#" method="post">
      <label for="staticrypt-password">Passcode</label>
      <div class="field">
        <input id="staticrypt-password" type="password" name="password" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
        <button type="button" class="toggle" id="toggle">Show</button>
      </div>
      <p class="error" id="error" role="alert"></p>

      <label id="staticrypt-remember-label" class="remember hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember" checked>
        Remember me on this device
      </label>

      <button type="submit">Start</button>
    </form>
  </div>
</div>
